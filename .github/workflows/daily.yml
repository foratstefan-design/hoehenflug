name: Tägliche Fragen
on:
  schedule:
    - cron: '0 21 * * *'   # täglich ca. 22 bis 23 Uhr deutscher Zeit: erzeugt die Fragen für morgen
  workflow_dispatch:        # Knopf zum Starten von Hand
permissions:
  contents: write
jobs:
  fragen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-data.mjs
      - name: Neue Dateien speichern
        run: |
          git config user.name "hoehenflug-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Neue Tagesfragen" && git push)
